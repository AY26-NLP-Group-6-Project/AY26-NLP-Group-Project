# Graph build config. See docs/graph.md
build_id: dev
dataset_id: gw1000
label_source: llm_pre
years: [2020, 2025]
# all = parse every kept report, so the retrieval corpus is the whole knowledge base
scope: all

# Aspect handling is normalised exact match; these caps keep generic spans
# ("waste", "data") from flooding the graph with string matches.
min_surface_chars: 10
min_surface_tokens: 2
max_string_matches_per_company_year: 3
seed: 20260912
