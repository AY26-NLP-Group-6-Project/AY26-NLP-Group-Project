[project]
name = "agentic-rag"
version = "0.1.0"
description = "Bounded plan-retrieve-stop agent over the shared passage store, shared classifier"
requires-python = ">=3.12"
dependencies = ["gw-common", "baseline-rag"]

[project.entry-points."gw.systems"]
agentic-rag = "agentic_rag:build_system"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_rag"]

[tool.uv.sources]
gw-common = { workspace = true }
baseline-rag = { workspace = true }
