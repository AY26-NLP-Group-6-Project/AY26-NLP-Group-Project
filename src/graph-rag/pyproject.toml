[project]
name = "graph-rag"
version = "0.1.0"
description = "Temporal claim graph over SGX sustainability reports: build, traversal retrieval, trajectories"
requires-python = ">=3.12"
dependencies = [
    "gw-common", "baseline-rag", "duckdb>=1.1", "networkx>=3.3", "pymupdf>=1.24", "pyyaml>=6",
    "scipy>=1.13", "fastembed>=0.4", "openpyxl>=3.1",
]

[project.scripts]
gw-graph = "graph_rag.cli:main"

[project.entry-points."gw.systems"]
graph-rag = "graph_rag:build_system"
agentic-graph-rag = "graph_rag.agent:build_system"

[project.entry-points."gw.corpora"]
graph = "graph_rag.corpus:GraphCorpus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_rag"]

[tool.uv.sources]
gw-common = { workspace = true }
baseline-rag = { workspace = true }
